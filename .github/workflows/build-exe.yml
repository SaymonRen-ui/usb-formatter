name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build onefile EXE
        run: pyinstaller --onefile --noconsole --uac-admin --name USB_Format --icon USB_Format.ico USB_Format.py

      - name: Attach EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/USB_Format.exe
